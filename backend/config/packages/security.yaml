security:
    # Las contraseñas se guardan cifradas con el mejor algoritmo disponible (bcrypt/argon2)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Los usuarios (clientes y trabajadores) se buscan por email en la entidad Usuario
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # POST /api/login: email + contraseña -> token JWT
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Resto de la API: sin sesiones, cada petición lleva su token
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

        # Web de los trabajadores (se completa en el B9)
                # Web de los trabajadores: login con formulario y sesión
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\TrabajadorUserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: admin
            logout:
                path: admin_logout
                target: admin_login

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/registro$, roles: PUBLIC_ACCESS }
        - { path: ^/api/estado$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(productos|videojuegos|tienda|departamentos), roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_TRABAJADOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
