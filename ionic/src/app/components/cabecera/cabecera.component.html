<ion-toolbar>
  <ion-buttons slot="start">
    <ion-menu-button></ion-menu-button>   <!-- ☰ abre el menú lateral -->
  </ion-buttons>
  <div class="marca"><span class="logo">J</span>JuegAlmi</div>
  <ion-buttons slot="end">
    <!-- Control por voz: se pone turquesa y late mientras escucha -->
    <button type="button" class="redondo microfono" [class.activo]="voz.escuchando()" (click)="voz.escuchar()"
            [attr.aria-label]="voz.escuchando() ? 'Escuchando…' : 'Control por voz'">
      <ion-icon name="mic-outline"></ion-icon>
    </button>
    <ng-content></ng-content>             <!-- p. ej. botón de buscar en Tienda -->
  </ion-buttons>
</ion-toolbar>
