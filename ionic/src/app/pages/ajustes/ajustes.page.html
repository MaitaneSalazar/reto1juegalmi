<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/cuenta" text=""></ion-back-button></ion-buttons>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="tarjeta lista">
    <div class="item"><ion-icon name="language-outline"></ion-icon><span class="crece">Idioma</span><span class="dato">Español</span></div>
    <div class="item"><ion-icon name="server-outline"></ion-icon><span class="crece">Origen de los datos</span><span class="dato">{{ origenDatos }}</span></div>
    <button type="button" class="item" (click)="vaciarCesta()"><ion-icon name="trash-outline"></ion-icon><span class="crece">Vaciar la cesta</span></button>
    <div class="item"><ion-icon name="information-circle-outline"></ion-icon><span class="crece">Versión</span><span class="dato">{{ version }}</span></div>
  </div>
</ion-content>
