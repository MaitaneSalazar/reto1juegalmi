<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/cuenta" text=""></ion-back-button></ion-buttons>
    <ion-title>Datos personales</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <div class="campo">
      <label>Nombre</label>
      <ion-input formControlName="nombre" aria-label="Nombre" [class.mal]="invalido('nombre')"></ion-input>
      @if (invalido('nombre')) { <p class="error">Escribe tu nombre.</p> }
    </div>
    <div class="fila2">
      <div class="campo">
        <label>1er apellido</label>
        <ion-input formControlName="apellido1" aria-label="Primer apellido" [class.mal]="invalido('apellido1')"></ion-input>
        @if (invalido('apellido1')) { <p class="error">Obligatorio.</p> }
      </div>
      <div class="campo">
        <label>2º apellido</label>
        <ion-input formControlName="apellido2" aria-label="Segundo apellido"></ion-input>
      </div>
    </div>
    <div class="campo">
      <label>Teléfono</label>
      <ion-input formControlName="telefono" type="tel" inputmode="tel" aria-label="Teléfono" [class.mal]="invalido('telefono')"></ion-input>
      @if (invalido('telefono')) { <p class="error">Teléfono no válido (9 cifras).</p> }
    </div>

    <!-- No editables -->
    <div class="campo"><label>DNI</label><div class="fijo">{{ sesion.usuario()?.dni }}</div></div>
    <div class="campo"><label>Email</label><div class="fijo">{{ sesion.usuario()?.email }}</div></div>

    <ion-button type="submit" expand="block" [disabled]="guardando()">
      @if (guardando()) { <ion-spinner name="crescent"></ion-spinner> } @else { Guardar cambios }
    </ion-button>
  </form>
</ion-content>
